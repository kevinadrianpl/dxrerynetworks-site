  <text x="120" y="155" fill="#ffffff" font-family="Nunito, sans-serif" font-size="42" font-weight="700">Command Reference</text>
  <text x="120" y="205" fill="#ddd6fe" font-family="Nunito, sans-serif" font-size="24">Player tools • chat • teleportation</text>
